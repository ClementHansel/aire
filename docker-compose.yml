# =============================================================================
# AIRE Operations Platform - Docker Compose (PRODUCTION-SAFE BASE)
# =============================================================================
# This base file is production-safe on its own:
#   - App images build the final `production` stage (no `target:` override).
#   - No host source bind-mounts (code is baked into the image).
#   - Every internal service is bound to 127.0.0.1 only (never 0.0.0.0).
#   - nginx has NO host port here — the overlay decides how it is exposed.
#
# Compose merges `-f` files by CONCATENATING ports/volumes (an override can add
# but never remove base entries), so the dev-only source mounts and host ports
# live in the overlays, not here.
#
#   Local dev/test : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   Production VPS : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# See docs/DEPLOYMENT.md and scripts/deploy-vps.sh (OOM-safe, one service at a time).
# =============================================================================

services:
  # =============================================================================
  # Data Layer
  # =============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: aire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aire}
      POSTGRES_USER: ${POSTGRES_USER:-aire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aire_secret}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aire} -d ${POSTGRES_DB:-aire}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aire-network

  redis:
    image: redis:7-alpine
    container_name: aire-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aire_redis_secret}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aire_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aire-network

  minio:
    image: minio/minio:latest
    container_name: aire-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aire_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aire_minio_secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aire-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aire-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${MQTT_WS_PORT:-9883}:9883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aire-network

  # =============================================================================
  # Application Layer
  #
  # No `target:` → Docker builds the final `production` stage of each Dockerfile.
  # The dev overlay flips this to `target: development` + adds source mounts.
  # =============================================================================

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: aire-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-aire}:${POSTGRES_PASSWORD:-aire_secret}@postgres:5432/${POSTGRES_DB:-aire}
      REDIS_URL: redis://:${REDIS_PASSWORD:-aire_redis_secret}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aire_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aire_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-aire-storage}
      MQTT_URL: mqtt://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Payment gateway — single source of config. Key "mock" runs the full
      # QRIS flow in sandbox (real DB, simulated gateway). Set XENDIT_API_KEY
      # to the real secret in .env to go live — no code changes needed.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-xendit}
      PAYMENT_SANDBOX_CONFIRM_DELAY_MS: ${PAYMENT_SANDBOX_CONFIRM_DELAY_MS:-6000}
      XENDIT_API_KEY: ${XENDIT_API_KEY:-mock}
      XENDIT_WEBHOOK_SECRET: ${XENDIT_WEBHOOK_SECRET:-mock_webhook_secret}
      MIDTRANS_API_KEY: ${MIDTRANS_API_KEY:-}
      MIDTRANS_WEBHOOK_SECRET: ${MIDTRANS_WEBHOOK_SECRET:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # WhatsApp (WAHA self-host). Provider/number/session are set per-tenant in the UI.
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      # Must match WHATSAPP_API_KEY on the waha service below; WAHA rejects /api calls without it.
      WAHA_API_KEY: ${WAHA_API_KEY:-aire_waha_local_key}
      KAPSO_URL: ${KAPSO_URL:-https://app.kapso.ai/api/v1}
      # Path (inside the container) to the branch-bridge installer zip served by
      # GET /api/bridges/:id/installer. Mount the built package here; unset/missing
      # → the endpoint returns 503 and the UI shows the copy-paste command instead.
      BRANCH_BRIDGE_PACKAGE: ${BRANCH_BRIDGE_PACKAGE:-/opt/branch-bridge-package.zip}
      # Simulation bypass. Default false → real WAHA connection (production).
      # Set WAHA_MOCK=true in .env (the dev overlay defaults it true) to capture
      # outbound in wa_mock_outbox and test the whole pipeline without a live number.
      WAHA_MOCK: ${WAHA_MOCK:-false}
      # Base URL the hosted n8n instance uses to call the bridge back (internal network).
      BRIDGE_CALLBACK_BASE: ${BRIDGE_CALLBACK_BASE:-http://backend:4000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      # Read-only Docker socket so the platform-admin System Health page can list
      # container status + tail logs. Safe to omit on hosts that forbid it — the
      # backend degrades gracefully (System Health hides the container panel).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - aire-network

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: aire-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:4000}
      # Public URL of the hosted n8n agent builder (link-out from the dashboards).
      NEXT_PUBLIC_N8N_URL: ${N8N_PUBLIC_URL:-https://flows.useairin.id}
    ports:
      # 127.0.0.1 only — nginx is the public entry point and proxies to this.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aire-network

  iot-gateway:
    build:
      context: .
      dockerfile: ./apps/iot-gateway/Dockerfile
    container_name: aire-iot-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4002
      DATABASE_URL: postgres://${POSTGRES_USER:-aire}:${POSTGRES_PASSWORD:-aire_secret}@postgres:5432/${POSTGRES_DB:-aire}
      REDIS_URL: redis://:${REDIS_PASSWORD:-aire_redis_secret}@redis:6379
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      WS_URL: http://backend:4000
    ports:
      - "127.0.0.1:${IOT_GATEWAY_PORT:-4002}:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:4002/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aire-network

  # =============================================================================
  # WHATSAPP GATEWAY (WAHA — unofficial, QR-scan). Optional: only needed when a
  # tenant chooses the WAHA provider. Kapso (cloud) needs no container.
  # =============================================================================

  waha:
    image: devlikeapro/waha:latest
    container_name: aire-waha
    restart: unless-stopped
    environment:
      WHATSAPP_HOOK_URL: http://backend:4000/api/whatsapp/webhook
      WHATSAPP_HOOK_EVENTS: message
      WAHA_PRINT_QR: "false"
      # Auto-start every persisted session on boot so a linked number survives
      # container restarts/redeploys without a fresh QR scan (data is on waha-data).
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      # API-key auth. Recent WAHA images require this; the backend sends it as X-Api-Key.
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-aire_waha_local_key}
    ports:
      - "127.0.0.1:${WAHA_PORT:-3001}:3000"
    volumes:
      - waha-data:/app/.sessions
    networks:
      - aire-network

  # =============================================================================
  # AGENT BUILDER (n8n — hosted, admin-only). Drag-and-drop flows that call the
  # AIRE bridge API. Persists to a volume (SQLite) — no extra DB needed. Exposed
  # to the public only via nginx (see infrastructure/nginx + the prod overlay).
  # =============================================================================

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: aire-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-flows.useairin.id}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      # N8N_PATH lets n8n live on a subpath (e.g. /flows/) behind nginx.
      N8N_PATH: ${N8N_PATH:-/}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-https://flows.useairin.id}/
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-https://flows.useairin.id}/
      GENERIC_TIMEZONE: ${TZ:-Asia/Jakarta}
      # Persisted so credentials/workflows survive restarts. MUST be set in .env.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_me_n8n_encryption_key}
      # Behind nginx TLS termination.
      N8N_PROXY_HOPS: 1
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
      NODE_ENV: production
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Custom AIRE node package (build it first: cd integrations/n8n-nodes-aire && npm i && npm run build).
      - ./integrations/n8n-nodes-aire:/home/node/.n8n/custom/n8n-nodes-aire:ro
    networks:
      - aire-network

  # =============================================================================
  # Reverse Proxy. NO host port here — the overlay exposes it:
  #   dev  → 127.0.0.1:${HTTP_PORT}:80
  #   prod → 80:80 + 443:443 (public) with letsencrypt certs mounted.
  # =============================================================================

  nginx:
    image: nginx:alpine
    container_name: aire-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aire-network

  # =============================================================================
  # DEMO ONLY — MediaMTX RTSP server for the "laptop webcam as CCTV" demo.
  # Enabled with `--profile demo`. scripts/demo-cctv.sh publishes the host
  # webcam into it; the branch-bridge reads rtsp://aire-mediamtx:8554/cam.
  # Not started by a normal `docker compose up`.
  # =============================================================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: aire-mediamtx
    restart: unless-stopped
    profiles: ["demo"]
    ports:
      - "127.0.0.1:${DEMO_RTSP_PORT:-8554}:8554"
    networks:
      - aire-network

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
  waha-data:
    driver: local
  n8n_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================

networks:
  aire-network:
    driver: bridge
